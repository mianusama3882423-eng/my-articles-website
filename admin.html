<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Daily Articles Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; }
        .header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 0.9rem; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.9rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .msg { margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚙️ Admin Dashboard</div>
        <div class="nav-links">
            <a href="index.html">View Website ↗</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Create New Article</h2>
            <form id="articleForm">
                <div class="form-group">
                    <label>Article Title</label>
                    <input type="text" id="title" required placeholder="e.g. How to Earn Online in 2026">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="Tech">Tech</option>
                        <option value="Business">Business</option>
                        <option value="Health">Health</option>
                        <option value="Lifestyle">Lifestyle</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Short Excerpt</label>
                    <input type="text" id="excerpt" required placeholder="Brief summary for homepage card">
                </div>
                <div class="form-group">
                    <label>Full Content</label>
                    <textarea id="content" rows="6" required placeholder="Write your main article content here..."></textarea>
                </div>
                <button type="submit">Publish Article</button>
                <div id="statusMsg" class="msg"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('statusMsg');
            msg.style.color = '#38bdf8';
            msg.innerText = "Publishing...";

            const newArticle = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                excerpt: document.getElementById('excerpt').value,
                content: document.getElementById('content').value
            };

            try {
                const res = await fetch('http://localhost:5000/api/articles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newArticle)
                });
                const data = await res.json();
                msg.style.color = '#4ade80';
                msg.innerText = "✅ Article Published Successfully!";
                document.getElementById('articleForm').reset();
            } catch (err) {
                msg.style.color = '#f87171';
                msg.innerText = "❌ Error: Could not connect to server";
            }
        });
    </script>
</body>
</html>
